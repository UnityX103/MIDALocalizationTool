<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDA 本地化编辑器</title>
<link rel="icon" type="image/svg+xml" href="app-icon.svg">
<style>
#mida-loc-app .rail svg{display:block;width:18px;height:18px;flex-shrink:0}
body{margin:0;padding:16px;background:#202427}
#mida-loc-app{--loc-bg:#202427;--loc-pane:#272c30;--loc-panel:#2d3338;--loc-line:#41484e;--loc-text:#edf0f3;--loc-muted:#adb6bf;--loc-blue:#9dcaff;--loc-red:#ffb4b4;--loc-green:#9ee2c0;font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--loc-text);background:var(--loc-bg);border:1px solid var(--loc-line);border-radius:12px;overflow:hidden;color-scheme:dark;position:relative;--loc-gap:20px}
#mida-loc-app *{box-sizing:border-box}#mida-loc-app button,#mida-loc-app input,#mida-loc-app select,#mida-loc-app textarea{font:inherit;color:inherit}#mida-loc-app button{cursor:pointer;border:1px solid var(--loc-line);background:var(--loc-panel);border-radius:6px;padding:6px 11px;white-space:nowrap}#mida-loc-app button:hover{border-color:#8995a1}#mida-loc-app button:disabled{opacity:.4;cursor:default}#mida-loc-app button:focus-visible,#mida-loc-app input:focus-visible,#mida-loc-app textarea:focus-visible,#mida-loc-app select:focus-visible{outline:2px solid var(--loc-blue);outline-offset:2px}#mida-loc-app button.primary{background:#c0dcff;color:#152c42;border-color:#c0dcff;font-weight:600}#mida-loc-app button.flat{background:transparent;border-color:transparent}#mida-loc-app input,#mida-loc-app select,#mida-loc-app textarea{background:var(--loc-bg);border:1px solid var(--loc-line);border-radius:6px;padding:8px 10px}#mida-loc-app textarea{width:100%;resize:vertical;min-height:95px;line-height:1.7}#mida-loc-app input[type=checkbox]{accent-color:var(--loc-blue);width:16px;height:16px;flex-shrink:0;padding:0;cursor:pointer}#mida-loc-app .muted{color:var(--loc-muted)}#mida-loc-app .tiny{font-size:11px}#mida-loc-app .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}#mida-loc-app .appbar{min-height:43px;padding:8px 16px;border-bottom:1px solid var(--loc-line);display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--loc-pane)}#mida-loc-app .wordmark{font-size:12px;font-weight:700;letter-spacing:1.2px}#mida-loc-app .platforms{font-size:11px;color:var(--loc-muted)}#mida-loc-app .shell{display:flex;height:690px;min-height:510px}#mida-loc-app .rail{width:66px;background:var(--loc-pane);border-right:1px solid var(--loc-line);display:flex;flex-direction:column;gap:10px;padding:16px 5px;flex-shrink:0}#mida-loc-app .rail button{border:0;padding:9px 1px;border-radius:6px;background:transparent;font-size:11px;display:flex;gap:4px;align-items:center;flex-direction:column;color:var(--loc-muted)}#mida-loc-app .rail button.active{background:var(--loc-bg);color:var(--loc-blue)}#mida-loc-app .rail i{display:block;width:18px;height:18px}#mida-loc-app .rail .spacer{flex:1}#mida-loc-app .taskpane{width:225px;flex-shrink:0;background:var(--loc-pane);display:flex;flex-direction:column;border-right:1px solid var(--loc-line)}#mida-loc-app .taskpane.collapsed{display:none}#mida-loc-app .taskhead{padding:19px 16px 14px}#mida-loc-app h2,#mida-loc-app h3,#mida-loc-app p{margin:0}#mida-loc-app .taskhead h3{font-size:14px;margin-bottom:5px}#mida-loc-app .tasklist{overflow-y:auto;flex:1;padding:4px 0 10px 10px}#mida-loc-app .taskrow{display:flex;align-items:flex-start;gap:7px;padding:10px 10px 10px 5px;border-radius:7px 0 0 7px;margin-bottom:5px;border:1px solid transparent}#mida-loc-app .taskrow.active{background:var(--loc-bg);border-color:var(--loc-line);border-right-color:var(--loc-bg)}#mida-loc-app .taskrow button{padding:0;border:0;background:none;text-align:left;white-space:normal;flex:1;min-width:0}#mida-loc-app .taskname{font-size:12px;overflow-wrap:anywhere;margin-bottom:5px}#mida-loc-app .taskmeta{display:flex;justify-content:space-between;color:var(--loc-muted);font-size:11px}#mida-loc-app .taskfoot{padding:12px;border-top:1px solid var(--loc-line);font-size:11px;color:var(--loc-muted)}#mida-loc-app .editor{flex:1;min-width:0;display:flex;flex-direction:column}#mida-loc-app .editorhead{padding:19px 22px 14px;display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}#mida-loc-app .editorhead h2{font-size:21px;letter-spacing:-.5px;font-weight:650}#mida-loc-app .headline{display:flex;align-items:center;gap:10px}#mida-loc-app .editorhead .muted{margin-top:5px}#mida-loc-app .badge{font-size:11px;border-radius:4px;padding:2px 7px;border:1px solid var(--loc-line);display:inline-block;white-space:nowrap}#mida-loc-app .pending{color:var(--loc-red)}#mida-loc-app .confirmed{color:var(--loc-green)}#mida-loc-app .toolbar{padding:0 22px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#mida-loc-app .toolbar input{min-width:140px;flex:1}#mida-loc-app .toolbar select{max-width:150px}#mida-loc-app .sentences{overflow:auto;flex:1;min-height:0;padding:0 22px 16px;scroll-behavior:smooth}#mida-loc-app .sentence{border:1px solid var(--loc-line);border-radius:8px;background:var(--loc-pane);margin-bottom:14px;overflow:hidden}#mida-loc-app .entryhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--loc-line);flex-wrap:wrap}#mida-loc-app .entryhead .number{font-variant-numeric:tabular-nums;color:var(--loc-muted)}#mida-loc-app .entryhead .tag{margin-left:auto;font-size:11px}#mida-loc-app .columns{display:grid;grid-template-columns:1fr 1fr;gap:var(--loc-gap);padding:16px}#mida-loc-app .columns>div{min-width:0}#mida-loc-app .label{font-size:11px;color:var(--loc-muted);margin-bottom:6px;display:block}#mida-loc-app .source{font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}#mida-loc-app .oldsource{margin-top:16px;padding-left:10px;border-left:2px solid var(--loc-line)}#mida-loc-app .oldsource .source{font-size:12px}#mida-loc-app .issue{margin-top:12px;font-size:11px;color:var(--loc-red)}#mida-loc-app details{margin-top:8px;color:var(--loc-muted);font-size:11px}#mida-loc-app summary{cursor:pointer}#mida-loc-app details p{white-space:pre-wrap;margin:6px 0}#mida-loc-app .entryactions{display:flex;gap:7px;justify-content:flex-end;padding:0 16px 13px;align-items:center}#mida-loc-app .entryactions .reason{margin-right:auto;font-size:11px;color:var(--loc-red)}#mida-loc-app .footer{padding:11px 22px;border-top:1px solid var(--loc-line);display:flex;align-items:center;gap:15px;flex-wrap:wrap;background:var(--loc-pane)}#mida-loc-app .progress{flex:1;min-width:120px}#mida-loc-app .track{height:4px;border-radius:5px;background:var(--loc-line);margin-top:5px}#mida-loc-app .track>div{height:100%;background:var(--loc-green);border-radius:5px;transition:width .15s}#mida-loc-app .statusbar{font-size:11px;color:var(--loc-muted);display:flex;justify-content:space-between;padding:6px 14px;border-top:1px solid var(--loc-line);gap:12px}#mida-loc-app .notice{padding:9px 22px;color:var(--loc-red);border-top:1px solid var(--loc-line)}#mida-loc-app .notice:empty{display:none}#mida-loc-app .empty{padding:70px 25px;text-align:center;color:var(--loc-muted)}#mida-loc-app .overlay{position:absolute;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:5}#mida-loc-app [hidden]{display:none!important}#mida-loc-app .dialog{background:var(--loc-pane);border:1px solid var(--loc-line);border-radius:10px;max-width:720px;width:100%;max-height:95%;padding:22px;overflow:auto;box-shadow:0 15px 50px #0007}#mida-loc-app .dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}#mida-loc-app .dialog h3{font-size:18px}#mida-loc-app .dialog textarea{height:330px;font-size:11px;font-family:ui-monospace,monospace;white-space:pre;resize:vertical}#mida-loc-app .dialogline{padding:13px 0;border-bottom:1px solid var(--loc-line);display:flex;align-items:center;gap:15px;justify-content:space-between}#mida-loc-app .dialogbottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}#mida-loc-app .helper{font-size:12px;color:var(--loc-muted);margin:10px 0}#mida-loc-app .jsonactions{display:flex;gap:8px;flex-wrap:wrap}#mida-loc-app .stacked .columns{grid-template-columns:1fr}#mida-loc-app .checklabel{display:flex;align-items:center;gap:7px}
#mida-loc-app.stacked .columns{grid-template-columns:1fr}
#mida-loc-app .dialogue-package{border:1px solid var(--loc-line);border-radius:8px;background:var(--loc-pane);margin-bottom:16px;overflow:hidden}
#mida-loc-app .packagehead{padding:13px 16px;background:var(--loc-panel);border-bottom:1px solid var(--loc-line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#mida-loc-app .packagehead h3{font:600 14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
#mida-loc-app .packagecount{margin-left:auto;color:var(--loc-muted);font-size:11px}
#mida-loc-app .packagehead h3{overflow-wrap:anywhere;min-width:0}
#mida-loc-app .compact-entry{padding:12px 16px}
#mida-loc-app .compact-entry p{white-space:pre-wrap;overflow-wrap:anywhere}
#mida-loc-app .dialogue-package .compact-entry+.compact-entry{border-top:0}
#mida-loc-app .dialogue-package [hidden]{display:none!important}
#mida-loc-app .dialogue-package .sentence{border:0;border-radius:0;margin:0;background:transparent}
#mida-loc-app .dialogue-package .sentence+.sentence{border-top:1px solid var(--loc-line)}
#mida-loc-app .dialogue-package .sentence.entry-highlight{box-shadow:inset 0 0 0 2px var(--loc-blue);animation:loc-entry-highlight 1.6s ease-in-out}
@keyframes loc-entry-highlight{0%,50%,100%{background:var(--loc-pane)}25%,75%{background:#384f64}}
@media(prefers-reduced-motion:reduce){#mida-loc-app .dialogue-package .sentence.entry-highlight{animation:none;background:#384f64}}
#mida-loc-app .dialog input.setting-switch{appearance:none;width:38px;height:22px;padding:2px;border-radius:12px;background:var(--loc-line);border:0;cursor:pointer}
#mida-loc-app .dialog input.setting-switch::before{content:'';display:block;width:18px;height:18px;border-radius:50%;background:var(--loc-text)}
#mida-loc-app .dialog input.setting-switch:checked{background:var(--loc-blue)}
#mida-loc-app .dialog input.setting-switch:checked::before{transform:translateX(16px);background:#152c42}
#mida-loc-app .dialogue-package .entryhead{border:0;padding:12px 16px 0}
#mida-loc-app .dialogue-package .columns{padding:10px 16px;gap:14px}
#mida-loc-app .dialogue-package textarea{min-height:76px}
#mida-loc-app .language-info{font-size:12px;color:var(--loc-blue)}
#mida-loc-app .space-controls{display:flex;flex-direction:column;gap:8px;margin:10px 0}
#mida-loc-app .space-controls select{width:100%;min-width:0}
#mida-loc-app .footer .progress{height:auto;display:block;overflow:visible;background:transparent;line-height:1.5}
#mida-loc-app .translation-row{display:flex;gap:14px;align-items:flex-start}
#mida-loc-app .translation-content{flex:1;min-width:0}
#mida-loc-app .translation-preview{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.85;min-height:28px}
#mida-loc-app .translation-row button{flex-shrink:0}
#mida-loc-app .entry-issue{font-size:11px;color:var(--loc-red);padding:0 16px 12px}
#mida-loc-app .entry-issue:empty{display:none}
#mida-loc-app .version-summary{display:flex;gap:12px;flex-wrap:wrap;padding:15px 0}
#mida-loc-app .version-summary>span{padding:8px 12px;background:var(--loc-bg);border:1px solid var(--loc-line);border-radius:6px}
@media(max-width:900px){#mida-loc-app .taskpane{width:185px}#mida-loc-app .editorhead,#mida-loc-app .toolbar,#mida-loc-app .footer{padding-left:15px;padding-right:15px}#mida-loc-app .sentences{padding-left:15px;padding-right:15px}#mida-loc-app .columns{grid-template-columns:1fr;gap:14px}#mida-loc-app .editorhead h2{font-size:18px}}@media(max-width:620px){#mida-loc-app .taskpane{width:145px}#mida-loc-app .rail{width:47px}#mida-loc-app .editorhead{padding:12px}#mida-loc-app .entryactions{flex-wrap:wrap}#mida-loc-app .shell{height:720px}}@media(prefers-reduced-motion:reduce){#mida-loc-app .sentences{scroll-behavior:auto}#mida-loc-app .track>div{transition:none}}
body{padding:12px}
#mida-loc-app{height:calc(100vh - 24px);min-height:610px;display:flex;flex-direction:column}
#mida-loc-app .workspace-layout{display:flex;flex:1;min-height:0;min-width:0;overflow:hidden}
#mida-loc-app .workspace-layout.preview-bottom{flex-direction:column}
#mida-loc-app .shell{height:auto;min-height:0;min-width:0;flex:1;overflow:hidden}
#mida-loc-app .appbar,#mida-loc-app .statusbar,#mida-loc-app .footer{flex-shrink:0}
#mida-loc-app .preview-panel{flex:0 0 var(--preview-size,38%);min-height:0;min-width:0;background:var(--loc-pane);padding:8px 12px;display:flex;flex-direction:column;overflow:hidden}
#mida-loc-app .preview-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#mida-loc-app .preview-header strong{min-width:0;overflow-wrap:anywhere}
#mida-loc-app .preview-body{padding-top:10px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#mida-loc-app .preview-body video{display:block;width:100%;height:100%;min-height:0;flex:1;background:#15181b;object-fit:contain;aspect-ratio:16/9}
#mida-loc-app .preview-message{color:var(--loc-muted);font-size:12px}
#mida-loc-app .preview-divider{flex:0 0 8px;background:var(--loc-line);cursor:col-resize;touch-action:none;position:relative}
#mida-loc-app .preview-bottom .preview-divider{cursor:row-resize}
#mida-loc-app .preview-divider:hover,#mida-loc-app .preview-divider:focus-visible{background:var(--loc-blue);outline:none}
#mida-loc-app.preview-resizing{user-select:none}
#mida-loc-app.preview-resizing video{pointer-events:none}
#mida-loc-app .package-video{font-size:11px}
@media(max-height:740px){#mida-loc-app .editorhead{padding-top:10px;padding-bottom:8px}}
#mida-loc-app button.danger{color:#ffb4ab;border-color:#b75c56;background:#392322}
#mida-loc-app button.danger:hover{border-color:#ffb4ab}
#mida-loc-app #loc-history-view[hidden]{display:none}
#mida-loc-app .about-nav{display:flex;gap:8px;margin-bottom:16px}
#mida-loc-app .repository-address{display:block;user-select:text;overflow-wrap:anywhere;margin:10px 0;font-size:12px}
#mida-loc-app .release-history{border-top:1px solid var(--loc-line);margin-top:16px;padding-top:16px}
#mida-loc-app .release-history pre{font:inherit;font-size:12px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--loc-muted)}
#mida-loc-app .editorhead{padding:6px 15px;gap:6px}
#mida-loc-app .editorhead>div{min-width:0;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
#mida-loc-app .editorhead h2{font-size:16px;line-height:1.4;letter-spacing:0;overflow-wrap:anywhere}
#mida-loc-app .editorhead .muted{margin-top:0;font-size:11px;line-height:1.4}
#mida-loc-app .headline{gap:7px;min-width:0;max-width:100%}
#mida-loc-app .headline button{padding:3px 7px}
#mida-loc-app .packagehead{padding:6px 12px;gap:6px 10px}
#mida-loc-app .packagehead h3{font-size:13px;line-height:1.4}
#mida-loc-app .packagehead button{padding:4px 9px}
#mida-loc-app .taskhead h3{display:flex;align-items:center;justify-content:space-between}
#mida-loc-app .taskfilter{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--loc-line);font-size:12px}
#mida-loc-app .taskfilter select{flex:1;min-width:0}
#mida-loc-app #loc-unsaved{color:var(--loc-red);font-size:20px;line-height:1}
#mida-loc-app #loc-save{background:#45484c;color:#dedfe1;border-color:#62676d}
#mida-loc-app #loc-save.unsaved{background:#a9363f;color:#fff;border-color:#d75660}
</style>
</head>
<body>
<div id="mida-loc-app" aria-label="MIDA 本地化编辑器">
  <header class="appbar"><span class="wordmark">MIDA <span class="muted">/ LOCALIZATION</span></span><span class="language-info" id="loc-import-language">尚未导入本地化数据</span></header>
  <div id="loc-history-view" class="appbar" hidden><strong id="loc-history-label">历史记录 · 只读</strong><span><button id="loc-history-return">返回当前最新版本</button> <button id="loc-history-restore" class="danger">回退为此历史记录</button></span></div>
  <div class="workspace-layout" id="loc-workspace-layout">
  <div class="shell">
    <nav class="rail" aria-label="应用栏目">
      <button class="active" id="loc-workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>工作台</button>
      <div class="spacer"></div>
      <button id="loc-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h4m4 0h10M3 12h10m4 0h4M3 18h4m4 0h10"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg>偏好</button>
      <button id="loc-about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>关于</button>
    </nav>
    <aside class="taskpane" id="loc-taskpane" aria-label="片段语言任务">
      <div class="taskhead"><h3>翻译任务<span id="loc-unsaved" hidden role="status" aria-label="有未保存的修改" title="有未保存的修改">*</span></h3><div class="space-controls"><select id="loc-space" aria-label="当前语言空间" disabled><option value="">拖入 ZIP 后自动创建</option></select></div></div>
      <label class="taskfilter" for="loc-task-filter">片段筛选<select id="loc-task-filter" disabled><option value="all">全部显示</option><option value="pending">仅未修复</option></select></label>
      <div class="tasklist" id="loc-tasks"></div>
      <div class="taskfoot"><label class="checklabel"><input type="checkbox" id="loc-all" disabled>全选交付任务</label><div id="loc-selection" style="margin-top:7px"></div></div>
    </aside>
    <main class="editor" aria-label="逐句编辑器">
      <div class="editorhead"><div><div class="headline"><button class="flat" id="loc-collapse" aria-label="收起任务菜单">☰</button><h2 id="loc-title">尚未导入本地化数据</h2><span class="badge" id="loc-task-version" hidden></span></div><div class="muted" id="loc-count"></div></div></div>
      <div class="toolbar"><input id="loc-search" type="search" placeholder="搜索 key、发言人、原文或译文" aria-label="搜索对话" disabled><select id="loc-filter" aria-label="复核状态" disabled><option value="all">全部对话</option><option value="pending">只看待处理</option><option value="confirmed">已确认</option></select><span class="badge muted" id="loc-snapshot" hidden></span></div>
      <section class="sentences" id="loc-sentences" aria-label="对话列表"></section>
      <div class="notice" id="loc-notice" role="status"></div>
      <footer class="footer"><div class="progress"><div class="tiny" id="loc-progress-text"></div><div class="track"><div id="loc-progress-bar"></div></div></div><button id="loc-next" disabled>下一处待处理 ↓</button><button id="loc-save" disabled>保存</button><button class="primary" id="loc-export" disabled>导出</button></footer>
    </main>
  </div>
  <div class="preview-divider" id="loc-preview-divider" role="separator" tabindex="0" aria-label="调整视频预览大小，拖到边缘收起，Home 键收起" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="65" aria-valuenow="38" hidden></div>
  <section class="preview-panel" id="loc-preview" aria-label="片段视频预览" hidden>
    <div class="preview-header"><strong data-preview-title>片段预览</strong></div>
    <div class="preview-body" hidden><video controls preload="metadata" playsinline aria-label="当前片段预览视频" hidden></video><p data-preview-message class="preview-message" role="status" hidden></p></div>
  </section>
  </div>
  <footer class="statusbar"><span id="loc-data-origin">尚未导入本地化数据</span><span id="loc-save-state" hidden>正在恢复自动保存…</span><button id="loc-app-update" hidden>检查更新</button></footer>
  <div class="overlay" id="loc-overlay" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="loc-dialog-title"><div class="dialoghead"><h3 id="loc-dialog-title"></h3><button id="loc-close" aria-label="关闭弹窗">关闭</button></div><div id="loc-dialog-content"></div></section>
  </div>
</div>
<script src="workspace-store.js"></script>
<script src="preview-player.js"></script>
<script>

 find('#loc-search').value='';find('#loc-filter').value='all';renderAll();changeSaved();
 const input=find('#loc-text-'+state.cursor),card=find('#loc-entry-'+state.cursor);
 input?.focus({preventScroll:true});card?.scrollIntoView({block:'center'});
 if(card){card.classList.add('entry-highlight');setTimeout(()=>card.classList.remove('entry-highlight'),1600);}
 setNotice('还有内容尚未编辑完成，已跳到最近编辑但未确定的这一句。请点击“确定”后再'+action+'。');return true;
}
async function attemptExport(allowUnresolved=false){
 if(exporting||historyView||historyBusy||importInProgress||switchingSpace||clearingCache||appUpdateInstalling||updateDialogActive)return;
 if(!state.selected.size){setNotice('请先勾选要导出的任务。');return;}
 if(jumpToLatestDraft())return;
 const unresolved=[...state.selected].reduce((count,index)=>count+tasks[index].entries.filter(entry=>entry.review.state!=='confirmed'||!entry.translation.trim()).length,0);
 if(unresolved&&!allowUnresolved){
  const content=openDialog('仍有待处理问题，是否继续导出？');
  content.append(element('p','helper',`所选任务还有 ${unresolved} 句待处理或译文为空。选择“是”将忽略这些问题并导出当前内容，保留原有待处理状态。`));
  const actions=element('div','dialogbottom'),cancel=element('button','','否'),confirm=element('button','primary','是');
  cancel.addEventListener('click',closeDialog);confirm.addEventListener('click',()=>{closeDialog();attemptExport(true);});actions.append(cancel,confirm);content.append(actions);return;
 }
 exporting=true;const button=find('#loc-export');button.disabled=true;setNotice('正在导出…');
 try{await exportPackage(packet(unresolved?'draft':'ready'),Boolean(unresolved&&allowUnresolved));}
 catch(error){setNotice('导出失败，当前编辑保留：'+String(error)+(nativeApp?'':'。请通过 serve.py 启动本地编辑器。'));}
 finally{exporting=false;updateSummary();}
}
find('#loc-export').addEventListener('click',()=>attemptExport());
find('#loc-next').addEventListener('click',()=>moveToNextPending());
find('#loc-close').addEventListener('click',closeDialog);
find('#loc-overlay').addEventListener('click',event=>{if(event.target===find('#loc-overlay'))closeDialog();});
root.addEventListener('keydown',event=>{if(!find('#loc-overlay').hidden){if(event.key==='Escape'){event.preventDefault();closeDialog();}else if(event.key==='Tab'){const controls=[...find('#loc-overlay').querySelectorAll('button,input,select,textarea')].filter(control=>!control.disabled&&control.getClientRects().length);const first=controls[0],last=controls[controls.length-1];if(first&&event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(first&&!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}}});
find('#loc-workspace').addEventListener('click',()=>{closeDialog();state.menu=true;renderAll();changeSaved();});
const cacheChannel=!nativeApp&&globalThis.BroadcastChannel?new BroadcastChannel('mida-localization-editor-cache'):null;
if(cacheChannel)cacheChannel.onmessage=event=>{
 if(event.data!=='clearing')return;
 clearingCache=true;storageReady=false;previewPlayer.video.pause();root.inert=true;
 setNotice('另一个编辑器页面正在清空所有空间。请等待该页面完成，再刷新此页面；本页已停止编辑和保存。');
};
function showClearCache(){
 if(historyView||historyBusy||importInProgress||switchingSpace||appUpdateInstalling||clearingCache){setNotice('请先返回当前最新版本，并等待当前操作完成后再清空缓存。');return;}
 const content=openDialog('确定要清空？');
 content.append(element('p','helper','将永久删除所有语言空间的任务、译文、未确认草稿、历史自动保存、备份和预览视频缓存，无法恢复。不会删除你选择的原始 ZIP 或已导出的文件。'));
 const actions=element('div','dialogbottom'),cancel=element('button','','取消'),confirm=element('button','danger','确定'),progress=element('p','helper');
 cancel.addEventListener('click',closeDialog);actions.append(cancel,confirm);content.append(progress,actions);
 confirm.addEventListener('click',async()=>{
  if(importInProgress||switchingSpace||appUpdateInstalling||clearingCache)return;
  clearingCache=true;storageReady=false;root.inert=true;confirm.disabled=true;cancel.disabled=true;previewPlayer.video.pause();cacheChannel?.postMessage('clearing');progress.textContent='正在清空所有空间，请勿关闭窗口…';
  try{
   await saveQueue.catch(()=>{});await workspaceStore.clearAll();
   localStorage.removeItem(spacePreferenceKey);localStorage.removeItem(skippedUpdateKey);knownSpaces.clear();originalSpaceLanguage=null;
   workspaceStore=new LocalizationWorkspaceStore();await workspaceStore.load();saveQueue=Promise.resolve();editRevision++;restoreWorkspace(null);storageReady=true;
   clearingCache=false;closeDialog();setNotice('所有空间的数据、历史自动保存、备份和视频缓存已清空。');
  }catch(error){
   restoreWorkspace(null);storageReady=false;progress.textContent='清空未全部完成：'+String(error.message||error)+'。已停止自动保存，请重试清空；不会将旧内容重新写回。';confirm.disabled=false;cancel.disabled=false;
  }finally{clearingCache=false;root.inert=false;renderSpaces();}
 });
}
find('#loc-settings').addEventListener('click',()=>{
 const content=openDialog('编辑偏好');const line=element('label','dialogline');line.append(element('span','','原文 / 译文布局'));
 content.append(element('p','helper','点击译文“确定”后立即保存当前片段。输入期间不会计时保存；手动保存前需先确定正在编辑的内容。'));
 const select=element('select');['双栏对照','上下排列'].forEach(value=>{const option=element('option','',value);option.value=value;select.append(option);});
 select.value=state.layout;select.addEventListener('change',()=>{state.layout=select.value;renderAll();changeSaved();});line.append(select);
 const autoNextLine=element('label','dialogline');autoNextLine.append(element('span','','自动下一条'));const autoNext=element('input','setting-switch');autoNext.type='checkbox';autoNext.setAttribute('role','switch');autoNext.checked=state.autoNext;
 autoNext.addEventListener('change',()=>{state.autoNext=autoNext.checked;changeSaved();});autoNextLine.append(autoNext);
 content.append(autoNextLine,element('p','helper','默认关闭。开启后，点击“确定”会自动展开并进入下一条待处理内容，短暂闪烁高亮目标条目；会清除搜索并切换到“只看待处理”。当前任务全部处理完成后停止跳转。'));
 const videoLine=element('label','dialogline');videoLine.append(element('span','','视频预览位置'));const placement=element('select');
 for(const [value,label] of [['right','右侧（默认）'],['bottom','下方']]){const option=element('option','',label);option.value=value;placement.append(option);}
 placement.value=state.previewPlacement;placement.addEventListener('change',()=>{state.previewPlacement=placement.value;renderPreviewLayout();changeSaved();});videoLine.append(placement);
 content.append(line,videoLine,element('p','helper','视频默认隐藏，点击“查看视频”显示。拖动分隔线调整大小，拖到最右侧（下方布局拖到底部）自动收起并暂停播放。视频按原比例完整显示；位置与大小随工作区保存。'),element('p','helper','支持语言、忽略包和角色映射来自 Unity 导出包，在翻译 App 中只读。'));
 const backups=element('button','','历史记录与自动备份');backups.addEventListener('click',showBackups);content.append(backups);
 const clearCache=element('button','danger','清空所有的缓存');clearCache.addEventListener('click',showClearCache);content.append(clearCache);
 if(nativeApp){const updates=element('button','','检查应用更新');updates.addEventListener('click',async()=>{await checkForAppUpdate();if(updateInfo?.available)showAppUpdate();else setNotice(find('#loc-app-update').textContent);});content.append(updates);}
});
function releaseSummary(version,notes){
 const previous={
  '0.3.0':'• 语言空间独立保存，切换更方便。\n• 支持视频预览和自动下一条。\n• 补齐离线图标，加入应用更新功能。',
  '0.3.1':'• 支持跨语言导入并切换到对应空间。\n• 历史记录可只读查看，回退前再次确认。\n• 新增缓存清理，全部对话默认收起。',
  '0.3.2':'• 展开对话时显示有内容的旧中文，收起后保持简洁。\n• 保留原始语言信息，兼容旧版数据包。',
  '0.3.3':'• 新版提醒支持立即更新、稍后提醒和跳过版本。\n• 新增“关于”，集中展示使用说明与版本历史。\n• 缩小标题栏，为对话正文留出更多空间。'
 };
 return previous[String(version).replace(/^v/,'')]||(typeof notes==='string'?notes.replace(/^# [^\n]*\n+/,'').trim():'')||'此版本包含功能改进和修复。';
}
find('#loc-about').addEventListener('click',()=>{
 if(importInProgress||switchingSpace||clearingCache||historyBusy||appUpdateInstalling)return;
 const content=openDialog('关于'),navigation=element('nav','about-nav'),repository=element('section'),instructions=element('section');navigation.setAttribute('aria-label','关于模块');
 const repositoryButton=element('button','','仓库'),instructionsButton=element('button','','使用说明');
 const selectModule=showRepository=>{repository.hidden=!showRepository;instructions.hidden=showRepository;repositoryButton.classList.toggle('primary',showRepository);instructionsButton.classList.toggle('primary',!showRepository);repositoryButton.setAttribute('aria-pressed',String(showRepository));instructionsButton.setAttribute('aria-pressed',String(!showRepository));};
 repositoryButton.addEventListener('click',()=>selectModule(true));instructionsButton.addEventListener('click',()=>selectModule(false));navigation.append(repositoryButton,instructionsButton);content.append(navigation,repository,instructions);
 repository.append(element('h3','','仓库'),element('code','repository-address','https://cnb.cool/nanzhaigame-xpy/MIDALocalizationTool'));
 const copy=element('button','','复制仓库地址');copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('https://cnb.cool/nanzhaigame-xpy/MIDALocalizationTool');copy.textContent='已复制';}catch{copy.textContent='复制失败，请选择地址手动复制';}});repository.append(copy,element('p','helper','版本更新历史 · 最近 5 条正式发布（按发布时间倒序）'));
 const history=element('div'),retry=element('button','','重新加载');repository.append(history,retry);
 const loadHistory=async()=>{
  retry.disabled=true;history.replaceChildren(element('p','helper','正在读取仓库更新历史…'));
  try{
   let result;if(nativeApp)result=await invokeNative('repository_history');else{const response=await fetch('/api/repository-history',{signal:AbortSignal.timeout(25000)});result=await response.json();requireValue(response.ok,result.error||'读取版本历史失败');}
   if(!history.isConnected)return;
   requireValue(Array.isArray(result.releases),'仓库版本历史格式无效');history.replaceChildren();
   if(!result.releases.length)history.append(element('p','helper','仓库暂无正式发布记录。'));
   for(const release of result.releases.slice(0,5)){
    const item=element('article','release-history'),date=new Date(release.publishedAt);
    item.append(element('strong','',typeof release.name==='string'&&release.name?release.name:release.tag));
    item.append(element('p','helper',release.tag+(release.publishedAt&&!Number.isNaN(date.getTime())?' · '+date.toLocaleString():'')));
    item.append(element('pre','',releaseSummary(release.tag,release.notes)));history.append(item);
   }
  }catch(error){if(history.isConnected)history.replaceChildren(element('p','helper pending','无法加载更新历史：'+String(error.message||error)+'。可以重试，使用说明仍可查看。'));}
  finally{retry.disabled=false;}
 };
 retry.addEventListener('click',loadHistory);
 instructions.append(element('h3','','使用说明'));
 [['中文原文','始终以只读文本显示。'],['目标语言文本','默认以文本预览，不显示输入框。'],['编辑','点击译文旁的编辑按钮后，才出现输入框。'],['确定','应用这句译文并退出编辑，恢复文本预览；也可原样沿用非空译文。'],['保存 / 导出','点击“确定”自动保存当前片段；保存和导出遇到未确定的编辑会定位最近编辑的一句；导出仍有待处理问题时可确认继续，偏好中可恢复备份。']].forEach(([title,text])=>{const row=element('div','dialogline');row.append(element('strong','',title),element('span','muted',text));instructions.append(row);});
 selectModule(true);loadHistory();
});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderAll});tweak.addSelect(state,'layout',{label:'对话布局',options:['双栏对照','上下排列']});tweak.addToggle(state,'menu',{label:'显示任务菜单'});}
renderAll();
const workspaceInitialization=initializeWorkspace();
if(nativeApp){
 workspaceInitialization.then(()=>checkForAppUpdate({startup:true}));
 nativeApp.event.listen('mida-update-progress',event=>{const progress=find('#loc-update-progress');if(progress){const {downloaded,total}=event.payload;progress.textContent=total?'正在更新 '+Math.min(100,Math.round(downloaded/total*100))+'%':'正在更新…';}}).catch(()=>{});
 document.title='MIDA 本地化编辑器';
 nativeApp.event.listen('mida-package-drop',async()=>{await workspaceInitialization;showVersionImport({nativeDrop:true});}).catch(error=>setNotice('拖入监听失败：'+String(error)));
 let closing=false;
 nativeApp.event.listen('mida-exit-requested',async()=>{
  if(closing)return;closing=true;
  try{await workspaceInitialization;if(historyBusy||importInProgress||switchingSpace||appUpdateInstalling||clearingCache){setNotice('当前操作尚未完成，请稍后再关闭窗口。');return;}if(!historyView&&state.modified)await saveWorkspace();await invokeNative('finish_exit');}
  catch(error){setNotice('退出前保存未完成，已保留窗口：'+String(error));}
  finally{closing=false;}
 }).catch(error=>setNotice('退出保护初始化失败：'+String(error)));
}
setInterval(presentPendingUpdate,1000);
window.addEventListener('beforeunload',event=>{if(state.modified){event.preventDefault();event.returnValue='';}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();attemptManualSave();}});
})();
