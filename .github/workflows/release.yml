name: Build and release desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-2022
            platform: windows
            bundle: src-tauri/target/release/bundle/nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.platform }}" = mac ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - run: npm ci
      - run: npm run ci:check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build pull request without update signing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = mac ]; then
            npm run release:mac -- --ci --config .ci/tauri-preview.json
          else
            npx tauri build --ci --config .ci/tauri-preview.json
          fi
      - name: Build release on hosted runner
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing shared updater signing key'; exit 1; }
          if [ "${{ matrix.platform }}" = mac ]; then
            npm run release:mac -- --ci
          else
            npx tauri build --ci
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            ${{ matrix.bundle }}/**/*.dmg
            ${{ matrix.bundle }}/**/*.tar.gz
            ${{ matrix.bundle }}/**/*.sig
            ${{ matrix.bundle }}/**/*.exe
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bundle-mac
          path: src-tauri/target/cloud-bundles/mac
      - uses: actions/download-artifact@v4
        with:
          name: bundle-windows
          path: src-tauri/target/cloud-bundles/windows
      - name: Prepare exact cloud artifacts
        env:
          MAC_BUNDLE_DIR: src-tauri/target/cloud-bundles/mac
          WINDOWS_BUNDLE_DIR: src-tauri/target/cloud-bundles/windows
        run: node scripts/prepare-release.cjs
      - name: Publish only complete new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-github.cjs
