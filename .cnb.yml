main:
  "crontab: */30 * * * *": &mirror
    - name: 同步 GitHub 源码与正式版本
      docker:
        image: node:22-bookworm
      lock:
        key: mida-github-mirror
        wait: true
      stages:
        - name: 同步源码、校验下载并更新国内镜像
          script: node scripts/mirror-github.cjs
          timeout: 30m
$:
  api_trigger: *mirror
