main:
  "crontab: */30 * * * *": &mirror
    - name: 同步 GitHub 源码与正式版本
      docker:
        image: node:22-bookworm
      lock:
        key: mida-github-mirror
        wait: true
      stages:
        - name: 同步源码、校验下载并更新国内镜像
          script: node scripts/mirror-github.cjs
          timeout: 30m
$:
  api_trigger: *mirror
  issue.open:
    # BEGIN cnb-feedback managed hook
    - git:
        enable: false
      docker:
        image: python:3.12-alpine
      imports:
        - "https://cnb.cool/nanzhaigame-xpy/minigame-preview-deploy-secrets/-/blob/main/feedback-all.yml"
      stages:
        - name: 通知 CNB 反馈服务
          script: |
            python - <<'PY'
            import hashlib, hmac, json, os, sys, time
            from urllib.request import Request, build_opener, HTTPRedirectHandler
            from urllib.error import HTTPError, URLError
            class NoRedirect(HTTPRedirectHandler):
                def redirect_request(self, *args):
                    return None
            url = os.environ["FEEDBACK_WEBHOOK_URL"]
            repo = os.environ["CNB_REPO_SLUG"]
            try:
                bundle = os.environ.get("FEEDBACK_WEBHOOK_SECRETS_JSON", "")
                if bundle:
                    secrets = json.loads(bundle)
                    if not isinstance(secrets, dict):
                        raise ValueError()
                    secret = secrets.get(repo, "")
                else:
                    secret = os.environ.get("FEEDBACK_WEBHOOK_SECRET", "")
            except (ValueError, TypeError):
                sys.exit("Webhook configuration is invalid")
            if not url.startswith("https://") or not isinstance(secret, str) or not 43 <= len(secret) <= 128:
                sys.exit("Webhook configuration is invalid")
            payload = {"repo": repo,
                       "issue": os.environ["CNB_ISSUE_IID"],
                       "event": os.environ["CNB_EVENT"],
                       "build_id": os.environ["CNB_BUILD_ID"], "sent_at": int(time.time())}
            body = json.dumps(payload, separators=(",", ":")).encode()
            signature = "sha256=" + hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
            for attempt in range(3):
                try:
                    req = Request(url, data=body, method="POST", headers={
                        "Content-Type": "application/json", "X-CNB-Signature": signature})
                    with build_opener(NoRedirect()).open(req, timeout=20) as res:
                        if res.status != 200:
                            sys.exit("Webhook was not accepted")
                    print("Webhook delivered")
                    break
                except HTTPError as exc:
                    if exc.code < 500 or attempt == 2:
                        sys.exit("Webhook delivery failed; inspect configuration")
                except (URLError, TimeoutError):
                    if attempt == 2:
                            sys.exit("Webhook delivery result is unknown; inspect delivery status")
                time.sleep(2 ** attempt)
            PY
    # END cnb-feedback managed hook
